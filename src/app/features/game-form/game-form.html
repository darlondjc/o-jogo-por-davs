<div class="page container">
  <a class="back" routerLink="/">← Voltar</a>
  <h1>Novo jogo</h1>
  <p class="muted">Preencha os dados básicos. Você poderá ajustar tudo depois.</p>

  <form class="card form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field-row">
      <label class="field">
        <span>Nome do jogo *</span>
        <input
          type="text"
          formControlName="name"
          placeholder="Ex: Trivia de sábado"
          [class.invalid]="form.controls.name.invalid && (form.controls.name.touched || submitted())"
        />
        @if (form.controls.name.invalid && (form.controls.name.touched || submitted())) {
          <span class="field-error">Informe o nome do jogo.</span>
        }
      </label>
      <label class="field">
        <span>Data *</span>
        <input
          type="date"
          formControlName="date"
          [class.invalid]="form.controls.date.invalid && (form.controls.date.touched || submitted())"
        />
        @if (form.controls.date.invalid && (form.controls.date.touched || submitted())) {
          <span class="field-error">Informe a data.</span>
        }
      </label>
      <label class="field">
        <span>Local *</span>
        <input
          type="text"
          formControlName="location"
          placeholder="Ex: Bar XYZ"
          [class.invalid]="form.controls.location.invalid && (form.controls.location.touched || submitted())"
        />
        @if (form.controls.location.invalid && (form.controls.location.touched || submitted())) {
          <span class="field-error">Informe o local.</span>
        }
      </label>
    </div>

    <label class="field">
      <span>Descrição</span>
      <textarea formControlName="description" rows="2" placeholder="Opcional"></textarea>
    </label>

    <div class="field-row">
      <label class="field">
        <span>Tipo de jogo</span>
        <select formControlName="gameType">
          @for (option of gameTypeOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span>Rodadas *</span>
        <input
          type="number"
          formControlName="rounds"
          min="1"
          [class.invalid]="form.controls.rounds.invalid && (form.controls.rounds.touched || submitted())"
        />
        @if (form.controls.rounds.invalid && (form.controls.rounds.touched || submitted())) {
          <span class="field-error">Deve ser >= 1.</span>
        }
      </label>
      <label class="field">
        <span>Perguntas por rodada *</span>
        <input
          type="number"
          formControlName="questionsPerRound"
          min="1"
          [class.invalid]="
            form.controls.questionsPerRound.invalid &&
            (form.controls.questionsPerRound.touched || submitted())
          "
        />
        @if (
          form.controls.questionsPerRound.invalid &&
          (form.controls.questionsPerRound.touched || submitted())
        ) {
          <span class="field-error">Deve ser >= 1.</span>
        }
      </label>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Salvando…' : 'Salvar e adicionar equipes' }}
    </button>
  </form>
</div>
