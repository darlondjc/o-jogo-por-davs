<div class="snackbar" [class.error]="kind() === 'error'" role="status" aria-live="polite">
  @if (kind() === 'success') {
    <svg class="icon" aria-hidden="true" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10.5l4 4 8-9" />
    </svg>
  } @else {
    <svg class="icon" aria-hidden="true" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 6v5M10 14h.01M2.5 10a7.5 7.5 0 1 0 15 0 7.5 7.5 0 0 0-15 0z" />
    </svg>
  }
  <span>{{ message() }}</span>
</div>
