<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes led-blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes row-flash{from{background:rgba(51,255,153,.3); border-color:#33ff99}}
@keyframes marquee-glow{0%,100%{text-shadow:0 0 12px #ffcc33aa,0 0 28px #ffcc3355}50%{text-shadow:0 0 20px #ffcc33ff,0 0 40px #ffcc3388}}
</style>
</helmet>
<div style="--bg:#05070d;--bg-elev:#0d1220;--bg-elev2:#141a2e;--border:#223050;--text:#eef2fb;--muted:#8894b8;--faint:#5c6890;--accent:{{ accentColor }};--gold:#ffcc33;--pos:#33ff99;--neg:#ff4d6a; background:radial-gradient(ellipse at 50% -10%, #101830 0%, var(--bg) 55%); color:var(--text); font-family:'Space Grotesk',sans-serif; min-height:100vh; position:relative; display:flex; justify-content:center;" style-before="content:''; position:absolute; inset:0; background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 3px); pointer-events:none; z-index:5; mix-blend-mode:overlay;">

  <main style="max-width: 800px; width: 100%; padding: 36px 20px 60px; display: flex; flex-direction: column; gap: 32px; align-items: center">
    <header style="text-align:center;">
      <p style="font-family:'Press Start 2P',monospace; font-size:22px; color:var(--gold); margin:0; animation:marquee-glow 2.4s ease-in-out infinite; letter-spacing:1px;">O JOGO</p>
      <p style="font-family:'JetBrains Mono',monospace; color:var(--accent); font-weight:700; font-size:13px; letter-spacing:2px; margin:10px 0 0;">RODADA {{ currentRound }} · PERGUNTA {{ currentQuestion }}</p>
      <p style="display:inline-flex; align-items:center; gap:8px; margin:10px 0 0; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; letter-spacing:1px; color:var(--pos);">
        <span style="width:9px; height:9px; border-radius:50%; background:currentColor; animation:led-blink 1.4s ease-in-out infinite;"></span>
        AO VIVO
      </p>
    </header>

    <section style="width:100%;">
      <h2 style="font-family:'Press Start 2P',monospace; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:0 0 16px; text-align:center;">PLACAR GERAL</h2>
      <ol style="list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;">
        <sc-for list="{{ boardRows }}" as="row" hint-placeholder-count="4">
          <li style="{{ row.style }}">
            <span style="{{ row.medalStyle }}">{{ row.medal }}</span>
            <span style="width:10px; height:10px; border-radius:50%; background:{{ row.color }};"></span>
            <span style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; flex:1;">{{ row.name }}</span>
            <span style="{{ row.trendStyle }}">{{ row.trendIcon }}</span>
            <span style="font-family:'Press Start 2P',monospace; font-size:18px; color:{{ row.color }}; min-width:4ch; text-align:right;">{{ row.total }}</span>
          </li>
        </sc-for>
      </ol>
    </section>

    <section style="width:100%;">
      <h2 style="font-family:'Press Start 2P',monospace; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:0 0 16px; text-align:center;">RODADA {{ currentRound }}</h2>
      <ol style="list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;">
        <sc-for list="{{ roundRows }}" as="rr" hint-placeholder-count="4">
          <li style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:var(--bg-elev2); border-radius:8px; border:1px solid var(--border); font-family:'JetBrains Mono',monospace;">
            <span style="font-weight:600; font-size:14px;">{{ rr.name }}</span>
            <span style="font-weight:700; font-size:14px; color:var(--pos);">+{{ rr.total }}</span>
          </li>
        </sc-for>
      </ol>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4ea1ff&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#4ea1ff&quot;,&quot;#ffcc33&quot;,&quot;#c084fc&quot;,&quot;#33ff99&quot;],&quot;section&quot;:&quot;Arcade&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const teams = [
      { name: 'OS FURIOSOS', color: '#ff4d6a', total: 148, trend: 'up', roundTotal: 10 },
      { name: 'QUIZ KINGS', color: '#4ea1ff', total: 136, trend: 'down', roundTotal: 0 },
      { name: 'TRIVIA NINJAS', color: '#33ff99', total: 129, trend: 'up', roundTotal: 15 },
      { name: 'CÉREBRO TOTAL', color: '#c084fc', total: 118, trend: 'same', roundTotal: 5 },
    ].sort((a, b) => b.total - a.total);

    const medals = ['①', '②', '③'];
    const boardRows = teams.map((t, i) => ({
      name: t.name, color: t.color, total: String(t.total).padStart(3, '0'),
      medal: medals[i] || (i + 1) + 'º',
      medalStyle: "font-family:'JetBrains Mono',monospace; font-size:15px; width:26px; text-align:center; color:" + (i === 0 ? '#ffcc33' : '#8894b8') + ';',
      trendIcon: t.trend === 'up' ? '▲' : t.trend === 'down' ? '▼' : '—',
      trendStyle: 'font-weight:800; width:1.2rem; text-align:center; color:' + (t.trend === 'up' ? '#33ff99' : t.trend === 'down' ? '#ff4d6a' : '#5c6890') + ';',
      style: 'display:flex; align-items:center; gap:12px; padding:14px 18px; border-radius:10px; background:' + (i === 0 ? 'linear-gradient(90deg, rgba(255,204,51,.15), #141a2e 65%)' : '#0d1220') + '; border:1px solid ' + (i === 0 ? '#ffcc33' : '#223050') + '; box-shadow:' + (i === 0 ? '0 0 20px -8px #ffcc33' : 'none') + ';',
    }));

    const roundRows = teams.filter((t) => t.roundTotal > 0).map((t) => ({ name: t.name, total: t.roundTotal }));

    return {
      accentColor: this.props.accentColor || '#4ea1ff',
      currentRound: 2, currentQuestion: 7,
      boardRows, roundRows,
    };
  }
}
</script>
</body>
</html>
