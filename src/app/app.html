<ng-progress ngProgressHttp />

@if (auth.user(); as user) {
  <div class="user-bar">
    @if (user.picture) {
      <img class="user-bar-avatar" [src]="user.picture" [alt]="user.name" />
    }
    <span class="user-bar-email">{{ user.email }}</span>
    <button type="button" class="btn btn-ghost btn-outline user-bar-logout" (click)="logout()">
      Sair
    </button>
  </div>
}

<!-- Scanline de CRT em cima de toda a navegação (spec: docs-migracao-design-arcade
     — o HUD de fliperama agora é o visual do app inteiro, não só de live/placar). -->
<div class="arcade-scanlines">
  <router-outlet />
</div>
